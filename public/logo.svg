<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Dark Mode Canvas (Remove this rect if you want a transparent background in your app) -->
  <rect width="400" height="100" fill="#0A0A0A"/>
  
  <!-- The Cypher Mark -->
  <!-- Outer Broken Ring -->
  <circle cx="60" cy="50" r="24" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="110 40" stroke-dashoffset="30" stroke-linecap="square"/>
  <!-- The Core (Artist/Energy) -->
  <circle cx="60" cy="50" r="10" fill="#E60000"/>

  <!-- The Wordmark -->
  <text x="115" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="8">CYPHR</text>
</svg>
