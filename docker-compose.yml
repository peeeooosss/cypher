version: "3.8"
services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: npm run dev

  socket:
    build: .
    ports: ["3001:3001"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: npx tsx server/socket.ts

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data: